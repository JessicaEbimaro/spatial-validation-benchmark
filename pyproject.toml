[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svb"
version = "0.1.0"
description = "Spatially blocked validation benchmark for Sentinel-2 land-cover classification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
download = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "stackstac>=0.5",
    "xarray>=2024.1",
    "dask[array]>=2024.1",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
